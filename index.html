  // ---------- Diagnóstico ----------

  function calcularPerfil() {
    const r = respostas;
    const f = FAIXAS[r.idade] || FAIXAS['6-8'];
    const novinho = r.idade === '0-3';
    const s = { relogio: 0, cansaco: 0, colo: 0, ritmo: 0 };

    if (r.dianoite === 'sim') s.relogio += novinho ? 5 : 3;
    if (r.dianoite === 'asvezes') s.relogio += novinho ? 2 : 1;

    const acordado = Number(r.acordado);
    if (acordado && acordado > f.janela[1]) s.cansaco += 3;
    if (r.sonecas === 'curtas') s.cansaco += 2;
    if (r.sonecas === 'quase') s.cansaco += 2;
    if (r.sonecas === 'longas' && novinho) s.relogio += 1;
    if (r.horario === 'tarde') s.cansaco += 2;
    if (r.tentou && r.tentou.includes('acordado')) s.cansaco += 1;

    // Recém-nascido mamar e colo para dormir é esperado: não entra como perfil
    if (!novinho) {
      if (r.adormece === 'mamando' || r.adormece === 'colo' || r.adormece === 'movimento') s.colo += 2;
      if (r.despertares === '2-3') s.colo += 1;
      if (r.despertares === '4-5' || r.despertares === 'muitas') s.colo += 2;
    }

    if (r.ritual === 'nao') s.ritmo += 2;
    if (r.ritual === 'asvezes') s.ritmo += 1;
    if (r.horario === 'sem') s.ritmo += 2;
    if (r.onde === 'varia') s.ritmo += 1;

    const ordem = ['relogio', 'cansaco', 'colo', 'ritmo'];
    let id = ordem.reduce((a, b) => (s[b] > s[a] ? b : a));
    if (s[id] === 0) id = novinho ? 'relogio' : 'ritmo';
    return { id, faixa: f, acordado };
  }

  function fatores(p) {
    const r = respostas, f = p.faixa, lista = [];
    if (p.acordado && p.acordado > f.janela[1]) {
      lista.push(['Fica acordado tempo demais entre os sonos', `Para ${f.titulo}, o ideal é entre ${horas(f.janela[0])} e ${horas(f.janela[1])}. Passando disso, o cansaço vira agitação.`]);

    if (r.dianoite === 'sim' || r.dianoite === 'asvezes') {
      lista.push(['Dia e noite ainda misturados', 'Luz, sons e o tempo das sonecas durante o dia ensinam o corpo do bebê a hora de descansar.']);
    }
    if (r.idade !== '0-3' && (r.adormece === 'mamando' || r.adormece === 'colo' || r.adormece === 'movimento') && r.despertares !== '0-1') {
      const como = { mamando: 'mamando', colo: 'no colo', movimento: 'em movimento' }[r.adormece];
      lista.push([`Associação: só dorme ${como}`, 'Quando acorda entre um ciclo e outro (o que é normal), precisa da mesma ajuda para voltar a dormir.']);
    }
    if (r.sonecas === 'curtas') lista.push(['Sonecas curtas', 'Sonecas de menos de 45 minutos indicam que o bebê não está conseguindo emendar os ciclos de sono.']);
    if (r.sonecas === 'quase') lista.push(['Pouco sono durante o dia', 'Sono de dia não "rouba" o sono da noite. Na verdade, sonecas boas ajudam a noite.']);
    if (r.horario === 'tarde') lista.push(['Dorme tarde', 'Para a maioria dos bebês, dormir depois das 21h aumenta o cansaço e os despertares de madrugada.']);
    if (r.horario === 'sem') lista.push(['Horários diferentes todo dia', 'O relógio do bebê se organiza com regularidade, principalmente no horário de acordar e de dormir.']);
    if (r.ritual === 'nao' || r.ritual === 'asvezes') lista.push(['Ritual da noite irregular', 'Uma sequência curta e sempre igual avisa ao corpo do bebê que a noite chegou.']);
    if (!lista.length) lista.push(['Ajustes finos na rotina', 'Mesmo com uma boa base, pequenos ajustes de horário para a idade fazem diferença.']);
    return lista.slice(0, 3);
  }

  function iniciarCronometro() {
    const fim = fimLancamento();
    if (!fim) return;
    const pad = n => String(n).padStart(2, '0');
    const tique = () => {
      const el = document.getElementById('cronometro');
      if (!el) return;
      const s = Math.max(0, Math.floor((fim - Date.now()) / 1000));
      const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
      el.textContent = (d ? d + 'd ' : '') + pad(h) + ':' + pad(m) + ':' + pad(ss);
      setTimeout(tique, 1000);
    };
    tique();
  }

<script>
  (function iniciarCronometro() {
    const TEMPO_TOTAL = 24 * 60 * 60; // 24 horas em segundos
    let tempoRestante = localStorage.getItem('tempo_cronometro_quiz');

    if (!tempoRestante) {
      tempoRestante = TEMPO_TOTAL;
      localStorage.setItem('tempo_cronometro_quiz', tempoRestante);
    }

    function atualizarRelogio() {
      let horas = Math.floor(tempoRestante / 3600);
      let minutos = Math.floor((tempoRestante % 3600) / 60);
      let segundos = tempoRestante % 60;

      horas = horas < 10 ? '0' + horas : horas;
      minutos = minutos < 10 ? '0' + minutos : minutos;
      segundos = segundos < 10 ? '0' + segundos : segundos;

      const elemento = document.getElementById('cronometro-oferta');
      if (elemento) {
        elemento.textContent = `${horas}:${minutos}:${segundos}`;
      } else {
        const elementoAntigo = document.getElementById('cronometro');
        if (elementoAntigo) elementoAntigo.textContent = `${horas}:${minutos}:${segundos}`;
      }

      if (tempoRestante > 0) {
        tempoRestante--;
        localStorage.setItem('tempo_cronometro_quiz', tempoRestante);
      } else {
        tempoRestante = 4 * 3600; // Reinicia em 4h quando zerar
      }
    }

    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);
  })();
</script>
